<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;" />
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #1e1e1e;
            overflow: hidden;
        }

        #term {
            position: absolute;
            inset: 0;
            padding: 4px;
        }

        /* Keep the xterm viewport from showing a scrollbar gutter jump */
        .xterm .xterm-viewport::-webkit-scrollbar {
            width: 10px;
        }

        .xterm .xterm-viewport::-webkit-scrollbar-thumb {
            background: #4b4b52;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="term"></div>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script src="vendor/addon-web-links.js"></script>
    <script src="vendor/addon-search.js"></script>
    <script src="bridge.js"></script>
</body>
</html>
