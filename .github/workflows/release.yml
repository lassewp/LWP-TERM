name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history so vpk can build deltas against the last release

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # vpk must match the Velopack package the app references (it warns, and may misbehave, when
      # they differ), so take its version from the csproj instead of installing whatever is newest.
      - name: Install Velopack CLI
        shell: pwsh
        run: |
          $ref = Select-Xml -Path src/LwpTerm.App/LwpTerm.App.csproj -XPath "//PackageReference[@Include='Velopack']"
          $ver = $ref.Node.Version
          if (-not $ver) { throw 'Could not read the Velopack version from LwpTerm.App.csproj' }
          Write-Host "Velopack library $ver -> installing vpk $ver"
          dotnet tool install -g vpk --version $ver

      - name: Test
        run: dotnet test -c Release

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish src/LwpTerm.App/LwpTerm.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.value }}
          -p:PublishSingleFile=false
          -o publish

      - name: Download previous release (for deltas)
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack
          --packId LwpTerm
          --packVersion ${{ steps.ver.outputs.value }}
          --packDir publish
          --mainExe LwpTerm.exe
          --packTitle "LWP-TERM"
          --icon src/LwpTerm.App/app.ico
          --framework webview2

      - name: Upload to GitHub Release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }}
          --releaseName "LWP-TERM ${{ steps.ver.outputs.value }}"
          --publish
